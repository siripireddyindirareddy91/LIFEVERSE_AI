services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: lifeverse
      POSTGRES_USER: lifeverse
      POSTGRES_PASSWORD: lifeverse_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeverse -d lifeverse"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lifeverse:lifeverse_local@db:5432/lifeverse
      RUNTIME_DATABASE_URL: postgresql+psycopg://lifeverse_app:lifeverse_app_local@db:5432/lifeverse
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  agent_worker:
    build: ./backend
    env_file: .env
    environment:
      RUNTIME_DATABASE_URL: postgresql+psycopg://lifeverse_app:lifeverse_app_local@db:5432/lifeverse
      DISPATCH_DATABASE_URL: postgresql+psycopg://lifeverse_dispatcher:dispatcher_local@db:5432/lifeverse
    command: ["python", "-m", "app.agentic.worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  automation_worker:
    build: ./backend
    env_file: .env
    environment:
      RUNTIME_DATABASE_URL: postgresql+psycopg://lifeverse_app:lifeverse_app_local@db:5432/lifeverse
      DISPATCH_DATABASE_URL: postgresql+psycopg://lifeverse_dispatcher:dispatcher_local@db:5432/lifeverse
    command: ["python", "-m", "app.automation.worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
