[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeverse-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.34.2",
  "pydantic-settings==2.9.1",
  "SQLAlchemy==2.0.41",
  "alembic==1.16.1",
  "psycopg[binary]==3.2.9",
  "PyJWT[crypto]==2.15.1",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "langgraph==1.2.24",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.11.12", "coverage==7.13.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
