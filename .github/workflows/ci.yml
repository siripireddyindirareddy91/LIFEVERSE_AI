name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: lifeverse
          POSTGRES_PASSWORD: lifeverse_local
          POSTGRES_DB: lifeverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeverse -d lifeverse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock
      - run: pip install --no-deps -e ./backend
      - name: Provision restricted database role
        env:
          PGPASSWORD: lifeverse_local
        run: psql -h localhost -U lifeverse -d lifeverse -v ON_ERROR_STOP=1 -f infrastructure/init-db.sql
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff check backend tools
      - run: ruff format --check backend tools
      - run: python tools/check_repository_security.py
      - run: coverage run --branch --source=backend/app -m pytest backend/tests -q --junitxml=reports/backend-tests.xml
        env:
          PERFORMANCE_REPORT: reports/performance.json
          TEST_DISPATCH_DATABASE_URL: postgresql+psycopg://lifeverse_dispatcher:dispatcher_local@localhost:5432/lifeverse
          TEST_DATABASE_URL: postgresql+psycopg://lifeverse_app:lifeverse_app_local@localhost:5432/lifeverse
      - run: coverage report --fail-under=80 && coverage xml -o reports/backend-coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: reports/
          retention-days: 14
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: dart run build_runner build
        working-directory: mobile
      - run: dart format --output=none --set-exit-if-changed lib test tool
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --coverage
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          retention-days: 14
      - run: flutter build apk --debug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-preview
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/security-tools.txt
      - run: mkdir -p reports
      - run: pip-audit -r backend/requirements.lock --no-deps --disable-pip --timeout 30 -f json -o reports/python-advisories.json
      - run: python tools/audit_mobile.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisories
          path: reports/
          retention-days: 14
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: flutter build web --release --base-href /app/ --no-pub --no-wasm-dry-run --dart-define=APP_ENV=development --dart-define=API_BASE_URL=https://api.invalid
        working-directory: mobile
      - run: python tools/package_download_site.py --site-only
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-web-assets
          path: .tools/cloudflare-web-assets.zip
          retention-days: 14
